name: tool_update

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
          
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      
      - name: Organize files
        run: |
          mkdir upload
          bash tool_update.sh

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: tool_update
          files: upload/*
